<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Rocket - Leaderboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse for CSV reading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <style>
    /* Sleek, non-intrusive Team Rocket Background */
    body {
      background-color: #020617; /* Very dark slate */
      background-image: 
        radial-gradient(circle at 50% 0%, #3f0000 0%, transparent 60%),
        radial-gradient(circle at 80% 100%, #1a0000 0%, transparent 50%);
      background-attachment: fixed;
    }
  </style>
</head>
<body class="text-white font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="flex items-center gap-4 mb-8 border-b-2 border-red-600/80 pb-4">
      <div class="bg-gradient-to-br from-red-500 to-red-700 text-slate-950 font-black text-5xl w-16 h-16 flex items-center justify-center rounded-xl shadow-[0_0_25px_rgba(220,38,38,0.4)] border border-red-400/50">
        R
      </div>
      <div>
        <h1 class="text-3xl md:text-4xl font-black text-red-500 tracking-wider drop-shadow-md">TEAM ROCKET</h1>
        <p class="text-slate-400 text-sm font-medium">Member Ranking & Weekly Target Tracker</p>
      </div>
    </header>

    <!-- Leaderboard Container -->
    <div class="bg-slate-900/80 backdrop-blur-sm rounded-xl p-6 border border-slate-700 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-slate-200">Weekly Performance</h2>
        <span class="bg-red-950/80 text-red-400 border border-red-800/50 text-xs px-3 py-1 rounded-full font-mono uppercase tracking-wider shadow-[0_0_10px_rgba(220,38,38,0.2)]">
          Active Week
        </span>
      </div>

      <!-- Member Rows -->
      <div id="leaderboard" class="space-y-4">
        <p class="text-slate-500 text-center py-8">Loading team data...</p>
      </div>
    </div>
  </div>

  <script>
    // Weekly Targets (Daily target x 5)
    const TARGETS = {
      'PA1': 150 * 5, // 750 tasks
      'PA2': 170 * 5  // 850 tasks
    };

    // Avatar Dictionary (Direct links to official Pokemon sprites)
    const AVATARS = {
      'Juan Zarate': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/150.png', // Mewtwo
      'Alejandro Betancur': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/52.png', // Meowth
      'Owen Jay': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/202.png', // Wobbuffet
      'Natalia Zea': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/24.png', // Arbok
      'Yesica Pereira': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/110.png', // Weezing
      'Felipe Hernandez': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/336.png', // Seviper
      'Dixon Mazo': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/331.png' // Cacnea
    };

    // Fallback avatar if someone changes their name or a new member is added
    const DEFAULT_AVATAR = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png';

    // Load local datos.csv
    fetch('datos.csv')
      .then(res => res.text())
      .then(csvText => {
        Papa.parse(csvText, {
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: (results) => renderLeaderboard(results.data)
        });
      })
      .catch(err => {
        document.getElementById('leaderboard').innerHTML = 
          `<p class="text-red-400 text-center py-4">Error loading data. Make sure the CSV file exists.</p>`;
      });

    function renderLeaderboard(data) {
      const members = data.map(m => {
        const target = TARGETS[m.Rol] || 750;
        const completed = m.TasksCompletadas || 0;
        const remaining = Math.max(0, target - completed);
        const percentage = Math.min(100, Math.round((completed / target) * 100));

        return { ...m, target, completed, remaining, percentage };
      });

      // Sort descending by completed tasks
      members.sort((a, b) => b.completed - a.completed);

      const container = document.getElementById('leaderboard');
      container.innerHTML = '';

      members.forEach((m, index) => {
        const rank = index + 1;
        let rankBadge = `<span class="text-slate-500 font-mono font-bold w-6 text-center">#${rank}</span>`;
        if (rank === 1) rankBadge = `<span class="text-2xl w-6 text-center drop-shadow-md">🥇</span>`;
        if (rank === 2) rankBadge = `<span class="text-2xl w-6 text-center drop-shadow-md">🥈</span>`;
        if (rank === 3) rankBadge = `<span class="text-2xl w-6 text-center drop-shadow-md">🥉</span>`;

        const statusText = m.remaining === 0 
          ? `<span class="text-emerald-400 font-bold drop-shadow-[0_0_5px_rgba(52,211,153,0.4)]">Target Reached! 🎉</span>`
          : `<span class="text-slate-400">Remaining: <strong class="text-slate-200">${m.remaining}</strong></span>`;

        // Get the avatar URL from our dictionary, or use the default Poke-ball
        const avatarUrl = AVATARS[m.Nombre] || DEFAULT_AVATAR;

        container.innerHTML += `
          <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 hover:border-red-500/50 hover:bg-slate-800/80 transition-all duration-300 flex flex-col md:flex-row items-center gap-4 shadow-lg group">
            
            <!-- Rank & Avatar Section -->
            <div class="flex items-center gap-3 w-full md:w-[40%]">
              ${rankBadge}
              
              <!-- Character Avatar -->
              <div class="relative">
                <div class="absolute inset-0 bg-red-600 rounded-full blur-md opacity-0 group-hover:opacity-40 transition-opacity duration-300"></div>
                <img src="${avatarUrl}" alt="${m.Nombre}'s Avatar" class="relative w-12 h-12 rounded-full border-2 border-red-900/80 bg-slate-950 object-contain p-0.5 z-10">
              </div>

              <div>
                <p class="font-bold text-slate-100 text-lg tracking-wide">${m.Nombre}</p>
                <span class="text-[10px] font-mono bg-slate-950 text-red-400 px-2 py-0.5 rounded border border-red-900/50 uppercase">${m.Rol} AGENT</span>
              </div>
            </div>

            <!-- Progress Bar Section -->
            <div class="w-full md:w-[60%] space-y-2">
              <div class="flex justify-between text-xs md:text-sm">
                <span class="text-slate-300 font-medium"><strong class="text-white text-base">${m.completed}</strong> / ${m.target} tasks</span>
                <span>${statusText}</span>
              </div>
              <div class="w-full bg-slate-950 h-3.5 rounded-full overflow-hidden p-0.5 border border-slate-800 shadow-inner">
                <div class="bg-gradient-to-r from-red-800 via-red-600 to-red-500 h-full rounded-full transition-all duration-1000 ease-out relative" style="width: ${m.percentage}%">
                  <!-- Glossy effect on the bar -->
                  <div class="absolute top-0 left-0 right-0 h-1/2 bg-white/20 rounded-t-full"></div>
                </div>
              </div>
            </div>
            
          </div>
        `;
      });
    }
  </script>
</body>
</html>
