<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket Team - Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <style>
    /* Color base y solución de scroll para móviles */
    body {
      background-color: #020617; 
    }
    
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 20%, #4a0000 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, #2a0000 0%, transparent 50%);
      z-index: -1;
    }
  </style>
</head>
<body class="text-white font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="flex items-center gap-4 mb-6 pb-4 border-b border-red-900/50">
      <div class="bg-gradient-to-br from-red-500 to-red-700 text-slate-950 font-black text-5xl w-16 h-16 flex items-center justify-center rounded-2xl shadow-[0_0_20px_rgba(220,38,38,0.5)] border border-red-400/50">
        R
      </div>
      <div>
        <h1 class="text-3xl md:text-4xl font-black text-red-500 tracking-wider drop-shadow-md">ROCKET TEAM</h1>
        <p class="text-slate-400 text-sm font-medium">Member Ranking & Weekly Target Tracker</p>
      </div>
    </header>

    <!-- TEAM LEADER SECTION (VIP CARD) -->
    <div class="mb-8">
      <div class="relative bg-slate-800/40 backdrop-blur-xl p-4 md:p-5 rounded-2xl border border-red-500/40 shadow-[0_8px_30px_0_rgba(220,38,38,0.15)] flex items-center gap-4 group hover:bg-slate-800/60 hover:border-red-400/60 transition-all duration-300 overflow-hidden">
        
        <!-- Reflejo sutil de fondo -->
        <div class="absolute inset-0 bg-gradient-to-r from-red-900/30 via-transparent to-transparent opacity-100 pointer-events-none"></div>

        <!-- Leader Avatar -->
        <div class="relative flex-shrink-0">
          <div class="absolute inset-0 bg-red-600 rounded-full blur-md opacity-30 group-hover:opacity-60 transition-opacity duration-300"></div>
          <img src="https://play.pokemonshowdown.com/sprites/trainers/cynthia.png" alt="Tatiana Gaviria - Boss" class="relative w-16 h-16 md:w-20 md:h-20 rounded-full border-2 border-red-500/60 bg-slate-900/90 backdrop-blur-sm object-contain p-1 z-10 shadow-lg">
          <!-- Corona de Jefe -->
          <div class="absolute -top-2 -right-2 text-2xl drop-shadow-[0_0_10px_rgba(250,204,21,0.8)] z-20">👑</div>
        </div>

        <!-- Leader Info -->
        <div class="relative z-10">
          <p class="font-black text-white text-xl md:text-2xl tracking-wide drop-shadow-md">Tatiana Gaviria</p>
          <div class="flex items-center mt-1">
            <span class="text-xs font-mono bg-red-950/80 text-red-300 px-3 py-1 rounded-md border border-red-500/40 uppercase tracking-widest backdrop-blur-sm shadow-inner">
              TEAM LEAD COL
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Leaderboard Container -->
    <div class="bg-slate-900/30 backdrop-blur-2xl rounded-3xl p-6 border border-slate-700/50 shadow-[0_8px_32px_0_rgba(0,0,0,0.5)]">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-slate-100 drop-shadow">Weekly Performance</h2>
        <span class="bg-red-950/40 text-red-400 border border-red-800/50 text-xs px-3 py-1 rounded-full font-mono uppercase tracking-wider backdrop-blur-md">
          Last Week
        </span>
      </div>

      <!-- Member Rows -->
      <div id="leaderboard" class="space-y-4">
        <p class="text-slate-400 text-center py-8">Loading team data...</p>
      </div>
    </div>
  </div>

  <script>
    const TARGETS = {
      'PA1': 150 * 5, 
      'PA2': 170 * 5  
    };

    const AVATARS = {
      'Juan Zarate': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/150.png', 
      'Alejandro Betancur': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/448.png', 
      'Owen Jay': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/94.png', 
      'Natalia Zea': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/24.png', 
      'Yesica Pereira': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/336.png', 
      'Felipe Hernandez': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/202.png', 
      'Dixon Mazo': 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/331.png' 
    };

    const DEFAULT_AVATAR = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png';

    fetch('datos.csv')
      .then(res => res.text())
      .then(csvText => {
        Papa.parse(csvText, {
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: (results) => renderLeaderboard(results.data)
        });
      })
      .catch(err => {
        document.getElementById('leaderboard').innerHTML = 
          `<p class="text-red-400 text-center py-4">Error loading data. Make sure the CSV file exists.</p>`;
      });

    function renderLeaderboard(data) {
      const members = data.map(m => {
        const target = TARGETS[m.Rol] || 750;
        const completed = m.TasksCompletadas || 0;
        const remaining = Math.max(0, target - completed);
        const percentage = Math.min(100, Math.round((completed / target) * 100));

        return { ...m, target, completed, remaining, percentage };
      });

      members.sort((a, b) => b.completed - a.completed);

      const container = document.getElementById('leaderboard');
      container.innerHTML = '';

      members.forEach((m, index) => {
        const rank = index + 1;
        let rankBadge = `<span class="text-slate-400/80 font-mono font-bold w-6 text-center">#${rank}</span>`;
        if (rank === 1) rankBadge = `<span class="text-2xl w-6 text-center drop-shadow-md">🥇</span>`;
        if (rank === 2) rankBadge = `<span class="text-2xl w-6 text-center drop-shadow-md">🥈</span>`;
        if (rank === 3) rankBadge = `<span class="text-2xl w-6 text-center drop-shadow-md">🥉</span>`;

        const statusText = m.remaining === 0 
          ? `<span class="text-emerald-400 font-bold drop-shadow-[0_0_5px_rgba(52,211,153,0.4)]">Target Reached! 🎉</span>`
          : `<span class="text-slate-300">Remaining: <strong class="text-white">${m.remaining}</strong></span>`;

        const avatarUrl = AVATARS[m.Nombre] || DEFAULT_AVATAR;

        container.innerHTML += `
          <div class="bg-slate-800/20 backdrop-blur-md p-4 rounded-2xl border border-white/5 hover:bg-slate-800/40 hover:border-red-500/30 transition-all duration-300 flex flex-col md:flex-row items-center gap-4 shadow-lg group">
            
            <div class="flex items-center gap-3 w-full md:w-[40%]">
              ${rankBadge}
              
              <div class="relative">
                <div class="absolute inset-0 bg-red-600 rounded-full blur-md opacity-0 group-hover:opacity-40 transition-opacity duration-300"></div>
                <img src="${avatarUrl}" alt="${m.Nombre}'s Avatar" class="relative w-12 h-12 rounded-full border border-red-900/50 bg-slate-900/50 backdrop-blur-sm object-contain p-0.5 z-10">
              </div>

              <div>
                <p class="font-bold text-slate-100 text-lg tracking-wide">${m.Nombre}</p>
                <span class="text-[10px] font-mono bg-slate-950/50 text-red-400 px-2 py-0.5 rounded-md border border-white/5 uppercase backdrop-blur-sm">${m.Rol} AGENT</span>
              </div>
            </div>

            <div class="w-full md:w-[60%] space-y-2">
              <div class="flex justify-between text-xs md:text-sm">
                <span class="text-slate-300 font-medium"><strong class="text-white text-base">${m.completed}</strong> / ${m.target} tasks</span>
                <span>${statusText}</span>
              </div>
              <div class="w-full bg-slate-950/50 backdrop-blur-sm h-3.5 rounded-full overflow-hidden p-0.5 border border-white/5 shadow-inner">
                <div class="bg-gradient-to-r from-red-800 via-red-600 to-red-500 h-full rounded-full transition-all duration-1000 ease-out relative shadow-[0_0_10px_rgba(220,38,38,0.5)]" style="width: ${m.percentage}%">
                  <div class="absolute top-0 left-0 right-0 h-1/2 bg-white/20 rounded-t-full"></div>
                </div>
              </div>
            </div>
            
          </div>
        `;
      });
    }
  </script>
</body>
</html>
